kind = "mobile"
previewPath = "/"
title = "CrossLex"
description = "A Dutch-first mobile Wordfeud helper that turns board screenshots into editable game boards and ranks legal moves by score, including every crossing word constraint."
version = "1.0.0"
id = "artifacts/crosslex"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23347

[services.development]
run = "pnpm --filter @workspace/crosslex run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crosslex", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/crosslex", "run", "serve" ]

[services.env]
PORT = "23347"
BASE_PATH = "/"
