openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scanner
    description: Wordfeud screenshot recognition
  - name: dictionary
    description: Wordfeud dictionary verification
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /scan-board:
    post:
      operationId: scanWordfeudBoard
      tags: [scanner]
      summary: Recognize a Wordfeud board and rack from a screenshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanBoardInput"
      parameters:
        - name: X-CrossLex-Device-ID
          in: header
          required: true
          description: Stable installation identifier generated by the mobile app
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      responses:
        "200":
          description: Recognized board position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanBoardResult"
        "400":
          description: Invalid screenshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid device identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Scan rate limit exceeded
          headers:
            Retry-After:
              description: Number of seconds before another scan may be attempted
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitError"
        "422":
          description: The board was recognized but V/W tiles require confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VWVerificationError"
        "502":
          description: Screenshot recognition failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /check-word:
    post:
      operationId: checkWordfeudWord
      tags: [dictionary]
      summary: Check a word against the current TaalTik Wordfeud list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckWordInput"
      responses:
        "200":
          description: TaalTik Wordfeud verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckWordResult"
        "400":
          description: Invalid word
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: TaalTik could not be reached or returned no verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ScanBoardInput:
      type: object
      properties:
        imageBase64:
          type: string
          description: Base64-encoded PNG, JPEG, or WebP screenshot
        mimeType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
      required:
        - imageBase64
        - mimeType
    ScanBoardResult:
      type: object
      properties:
        board:
          type: array
          minItems: 15
          maxItems: 15
          items:
            type: array
            minItems: 15
            maxItems: 15
            items:
              type: string
        rack:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        warnings:
          type: array
          items:
            type: string
      required:
        - board
        - rack
        - confidence
        - warnings
    VWAmbiguousTile:
      type: object
      properties:
        kind:
          type: string
          enum: [board, rack]
        row:
          type: integer
          minimum: 1
          maximum: 15
        col:
          type: integer
          minimum: 1
          maximum: 15
        position:
          type: integer
          minimum: 1
          maximum: 7
        initialLetter:
          type: string
          enum: [V, W]
      required:
        - kind
        - initialLetter
    VWVerificationError:
      type: object
      properties:
        code:
          type: string
          enum: [VW_VERIFICATION_REQUIRED]
        error:
          type: string
        scan:
          $ref: "#/components/schemas/ScanBoardResult"
        ambiguousTiles:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/VWAmbiguousTile"
      required:
        - code
        - error
        - scan
        - ambiguousTiles
    CheckWordInput:
      type: object
      properties:
        word:
          type: string
          minLength: 2
          maxLength: 15
          pattern: "^[A-Za-z]{2,15}$"
      required:
        - word
    CheckWordResult:
      type: object
      properties:
        word:
          type: string
        allowed:
          type: boolean
        source:
          type: string
        checkedAt:
          type: string
          format: date-time
      required:
        - word
        - allowed
        - source
        - checkedAt
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    RateLimitError:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          properties:
            retryAfterSeconds:
              type: integer
              minimum: 1
          required:
            - retryAfterSeconds

