openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scanner
    description: Wordfeud screenshot recognition
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /scan-board:
    post:
      operationId: scanWordfeudBoard
      tags: [scanner]
      summary: Recognize a Wordfeud board and rack from a screenshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanBoardInput"
      responses:
        "200":
          description: Recognized board position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanBoardResult"
        "400":
          description: Invalid screenshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Screenshot recognition failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ScanBoardInput:
      type: object
      properties:
        imageBase64:
          type: string
          description: Base64-encoded PNG, JPEG, or WebP screenshot
        mimeType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
      required:
        - imageBase64
        - mimeType
    ScanBoardResult:
      type: object
      properties:
        board:
          type: array
          minItems: 15
          maxItems: 15
          items:
            type: array
            minItems: 15
            maxItems: 15
            items:
              type: string
        rack:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        warnings:
          type: array
          items:
            type: string
      required:
        - board
        - rack
        - confidence
        - warnings
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

